version: '3.7'

services:
  caddy:
    build:
      context: ./build/caddy
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'

volumes:
  caddy-data:
    name: 'chatsift-caddy-data'
  caddy-config:
    name: 'chatsift-caddy-config'
